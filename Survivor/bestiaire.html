<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestiaire — Last Pulse</title>
    <meta
      name="description"
      content="Bestiaire de Last Pulse : la fiche de chaque ennemi et de chaque boss (capacités, statistiques, où les trouver, astuces), débloquée en les éliminant en jeu."
    />
    <link rel="canonical" href="https://last-pulse.com/bestiaire.html" />
    <meta name="theme-color" content="#1a0b2e" />
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="stylesheet" href="css/bestiary.css" />
  </head>
  <!-- Bestiaire (wiki des ennemis) : page à part, comme les conditions générales. Textes dans
       src/data/bestiary.js, chiffres dans src/data/enemies.js, fiches débloquées lues dans la sauvegarde
       du navigateur (account.bestiary, voir src/services/bestiary.js). Script : src/bestiary/page.js. -->
  <body>
    <main>
      <a class="back" href="./">← Retour au jeu</a>
      <header class="bs-head">
        <img src="assets/logo-mark.svg" alt="" width="48" height="48" />
        <div>
          <h1>BESTIAIRE</h1>
          <p class="bs-sub">Le wiki des ennemis de Last Pulse</p>
        </div>
      </header>

      <section class="bs-progress" aria-live="polite">
        <div class="bs-progress-text">
          <b id="bsFound">0</b> / <span id="bsTotal">0</span> fiches débloquées
        </div>
        <div class="bs-bar"><div id="bsBar"></div></div>
        <p class="bs-hint">
          Éliminez un ennemi en jeu pour débloquer sa fiche. Des succès récompensent 10, 25 et toutes les
          fiches.
        </p>
      </section>

      <div class="bs-tools">
        <input
          id="bsSearch"
          type="search"
          placeholder="Rechercher un ennemi..."
          aria-label="Rechercher un ennemi"
        />
        <div id="bsFilters" class="bs-filters" role="radiogroup" aria-label="Catégorie"></div>
      </div>

      <noscript
        ><p class="bs-hint">Le bestiaire a besoin de JavaScript pour afficher les fiches.</p></noscript
      >
      <div id="bsList"></div>
    </main>

    <dialog id="bsEntry" class="bs-entry" aria-labelledby="bsEntryName">
      <button class="bs-close" type="button" aria-label="Fermer">×</button>
      <div class="bs-entry-top">
        <canvas id="bsEntrySprite" width="200" height="200"></canvas>
        <div>
          <span id="bsEntryGroup" class="bs-tag"></span>
          <h2 id="bsEntryName"></h2>
          <p id="bsEntryWhere" class="bs-where"></p>
          <p id="bsEntryKills" class="bs-kills"></p>
        </div>
      </div>
      <div id="bsEntryBody"></div>
    </dialog>

    <script type="module" src="src/bestiary/page.js"></script>
  </body>
</html>
