name: Déploiement sur IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Version du jeu (7 premiers caractères du commit) : jointe aux rapports d'erreurs (services/diagnostics.js)
      - name: Numéro de version
        run: |
          printf '// Généré au déploiement (.github/workflows/deploy.yml) : commit envoyé en ligne.\nexport const BUILD = "%s";\n' "${GITHUB_SHA::7}" > Survivor/src/build.js
          cat Survivor/src/build.js

      # FTP-Deploy-Action ne sait pas faire de SFTP (seulement ftp / ftps) : on passe par lftp.
      - name: Installation de lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Seul le dossier Survivor/ (le jeu) est envoyé, dans le dossier de l'espace web relié à
      # last-pulse.com : `last-pulse` (IONOS refuse la racine), ou la variable de dépôt IONOS_DIR. Rien n'est effacé sur le serveur.
      - name: Envoi du jeu en SFTP sur IONOS
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          IONOS_DIR: ${{ vars.IONOS_DIR || 'last-pulse' }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p 22 "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 Survivor/ $IONOS_DIR;
            bye"
