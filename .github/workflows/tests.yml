name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, syntaxe & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Vérification des types (JSDoc)
        run: npm run typecheck

  e2e:
    name: Jeu (PC + mobile) ${{ matrix.shard }}/2
    # Version d'Ubuntu figée : « ubuntu-latest » est passé à la 26.04, que Playwright 1.56 ne prend pas en charge
    # (échec dès « playwright install --with-deps »).
    runs-on: ubuntu-24.04
    # Suite coupée en deux moitiés lancées en parallèle : d'un seul tenant elle frôlait la limite
    # (14,7 min sur 15 après la PR #56, job annulé alors que tous les tests passaient).
    # Pour plus de parts : ajouter une valeur à « shard » et remplacer « /2 » partout.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Lancer les tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
